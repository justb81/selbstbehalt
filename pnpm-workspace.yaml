packages:
  - 'apps/*'
  # Shared code (Zod schemas & types) lives here, e.g. packages/shared.
  - 'packages/*'

overrides:
  # onnxruntime-node (an unused, non-built peer of ppu-paddle-ocr — see allowBuilds
  # below) transitively pulls in adm-zip <0.6.0, which `pnpm audit` flags as high
  # (GHSA-xcpc-8h2w-3j85: a crafted ZIP triggers a 4 GB allocation). adm-zip is only
  # used by onnxruntime-node's native-binary extraction, which never runs here (its
  # build is disabled and the app uses onnxruntime-web), so forcing the patched line
  # is safe and clears the advisory.
  adm-zip@<0.6.0: '>=0.6.0'

  # postcss <=8.5.17 carries a high-severity path-traversal advisory
  # (GHSA-r28c-9q8g-f849): the previous-source-map auto-loader follows a crafted
  # `sourceMappingURL` and can disclose arbitrary .map files. It reaches us only
  # transitively through the Vite/SvelteKit toolchain (bits-ui → runed →
  # @sveltejs/kit → vite → postcss, 18 paths in all), so there is no direct
  # dependency to bump and the patched line has to be forced here.
  #
  # postcss also bundles nanoid, and nanoid <3.3.17 has its own high-severity
  # advisory (GHSA-2v37-7h3g-55p8: a custom generator with size 0 loops
  # indefinitely). postcss only bumped its nanoid dependency past that in 8.5.26,
  # so the floor is raised to that version to close both advisories at once.
  # 8.5.26 (2026-08-06) and the nanoid it pulls in (3.3.18, 2026-08-07) are both
  # inside the 7-day cooldown as of writing — see the explicit
  # minimumReleaseAgeExclude entries below for why that's an accepted, deliberate
  # exception here rather than drift.
  postcss@<8.5.26: '>=8.5.26'

allowBuilds:
  esbuild: true
  better-sqlite3: true
  # The browser PWA uses onnxruntime-web only; onnxruntime-node is pulled in as an
  # (unused) peer of ppu-paddle-ocr — never build its native binary, and skip
  # protobufjs' optional install script. Neither runs in the browser.
  onnxruntime-node: false
  protobufjs: false
  # Note: @napi-rs/canvas (pulled in via ppu-paddle-ocr → ppu-ocv) needs NO entry
  # here. It has no install/postinstall lifecycle script — only a manual `build`
  # script that pnpm never runs on install — and ships prebuilt platform binaries
  # as optional deps. It is also never loaded on the web OCR path (we use
  # onnxruntime-web + the `canvas-native` engine), so an allowBuilds entry would
  # be inert.

# Supply-chain cooldown: a newly published version may only be resolved once it
# is at least 7 days old (value is in minutes: 7 × 24 × 60 = 10080). This mirrors
# the Dependabot `cooldown` setting so manual `pnpm add`/`pnpm update` are held to
# the same rule.
#
# This is enforced twice, and the second half is the one that bites in CI: pnpm 11
# also verifies *every* entry already in the lockfile against the policy, including
# on `pnpm install --frozen-lockfile`. A lockfile carrying a too-young version
# therefore fails the install outright (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION) —
# see the note in CLAUDE.md on how Dependabot PRs trip this.
minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - eslint-plugin-svelte@3.20.0
  - eslint@10.6.0
  - pdfjs-dist@6.1.200
  - prettier@3.9.0
  # Deliberate exceptions to close two high-severity advisories (postcss
  # path-traversal + nanoid infinite-loop, see the postcss override above)
  # despite both landing inside the 7-day cooldown. Revisit once each has
  # naturally aged past it — the exclusion can be dropped at that point.
  - postcss@8.5.26
  - nanoid@3.3.18

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
