version: 2

updates:
  # npm / pnpm dependencies across the whole workspace (root + frontend + backend).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Supply-chain cooldown: never adopt a version until it has been published
    # for at least 7 days. Guards against freshly-published compromised releases.
    # Applies only to version updates and only to the target version — security
    # updates, and the transitive packages dragged along when the lockfile is
    # rebuilt, are not covered by it. Those still land too young and fail CI's
    # `minimumReleaseAge` check; redo such a bump locally instead of widening
    # any policy (see CLAUDE.md, "Working notes").
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      prod-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (the native compiler rewrite) is not yet usable here:
      # typescript-eslint still caps its peer range at `typescript: >=4.8.4 <6.1.0`
      # in every release (checked through 8.65.0 and the 8.65.1 pre-releases), and
      # `pnpm lint` dies on TS 7 with "Cannot read properties of undefined
      # (reading 'Cjs')" inside @typescript-eslint/typescript-estree. Since
      # eslint.config.js uses type-aware linting (`projectService: true`), there is
      # no way to opt out. Drop this entry once typescript-eslint widens the range,
      # then do the TS 7 migration deliberately rather than via a bump PR.
      # Only majors are ignored — 6.x minor/patch updates still flow normally.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # GitHub Actions used by the CI workflows. All `uses:` refs are pinned to a
  # full commit SHA with the version in a trailing comment; Dependabot updates
  # SHA and comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
