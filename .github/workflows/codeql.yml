name: CodeQL

# Docs/assets carry no analysable JS/TS, so skip code scanning for changes that
# only touch them. The weekly schedule below still performs a full scan
# regardless of which paths changed.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'assets/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'assets/**'
      - 'LICENSE'
  schedule:
    # Weekly full scan (Mondays 06:17 UTC) to catch advisories published after a PR merged.
    - cron: '17 6 * * 1'

# Cancel superseded runs on the same ref (e.g. force-pushes to a PR branch).
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # Required to upload results to the code-scanning dashboard.
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # JavaScript and TypeScript share a single CodeQL extractor.
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          # `security-and-quality` adds maintainability/quality queries on top of
          # the default security suite. Drop to `security-extended` if too noisy.
          queries: security-and-quality

      # No compiled languages here — JS/TS needs no build step, so analyze directly.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: '/language:${{ matrix.language }}'
