name: CodeQL

# Docs/assets carry no analysable JS/TS, so skip code scanning for changes that
# only touch them. The weekly schedule below still performs a full scan
# regardless of which paths changed.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'assets/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'assets/**'
      - 'LICENSE'
  schedule:
    # Weekly full scan (Mondays 06:17 UTC) to catch advisories published after a PR merged.
    - cron: '17 6 * * 1'

# Cancel superseded runs on the same ref (e.g. force-pushes to a PR branch).
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      # Required to upload results to the code-scanning dashboard.
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: javascript-typescript
          # `security-and-quality` adds maintainability/quality queries on top of
          # the default security suite. Drop to `security-extended` if too noisy.
          queries: security-and-quality

      # No compiled languages here — JS/TS needs no build step, so analyze directly.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:javascript-typescript'
