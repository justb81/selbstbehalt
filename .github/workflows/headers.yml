name: Docs & license gate

# Deliberately without `paths-ignore`: CI skips docs-, asset- and licence-only
# changes, so a new file added there — or a stale reference into the architecture
# doc — would slip past the gate. Both checks here are plain Node with no install,
# cheap enough to run on every change instead.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. force-pushes to a PR branch).
concurrency:
  group: headers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  headers:
    name: SPDX headers + architecture-doc references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The reverse index below diffs against the PR's base commit, which the
          # default shallow clone does not contain.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Verifies that every first-party file names both its copyright holder and
      # its license. The script has no dependencies, so no `pnpm install` here.
      - name: Check SPDX headers
        run: node scripts/check-spdx-headers.mjs

      # Verifies that every §-reference into docs/architecture.md still resolves and
      # that no file points at its former name. Also dependency-free.
      - name: Check architecture-doc references
        run: node scripts/check-doc-refs.mjs

      # The other direction (issue #463): which documented passages describe code this
      # PR changed? Advisory — it prints the passages and always succeeds, because most
      # changes need no documentation edit and a gate that cries wolf gets ticked past.
      # The point is that the list is impossible to miss, not that it blocks.
      - name: Documentation describing the changed code
        if: github.event_name == 'pull_request'
        env:
          # `HEAD^1`, not `pull_request.base.sha`: on a pull_request event checkout
          # resolves refs/pull/N/merge — this branch merged into the *current* main —
          # whose first parent is that main. `base.sha` still names the base the PR was
          # opened against, so diffing against it drags in every unrelated file main
          # gained meanwhile (observed: a component from another merged PR).
          DOCS_AFFECTED_BASE: HEAD^1
        run: node scripts/check-doc-refs.mjs --affected | tee -a "$GITHUB_STEP_SUMMARY"
