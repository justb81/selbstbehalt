name: Security

# Dependency audit, licence check and SBOM only depend on the resolved
# dependency graph and the licence allowlist script — so trigger on changes to
# the manifests, lockfile, that script, or this workflow itself. The weekly
# schedule below re-scans regardless, surfacing newly disclosed advisories.
on:
  push:
    branches: [main]
    paths:
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/check-licenses.mjs'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/check-licenses.mjs'
      - '.github/workflows/security.yml'
  schedule:
    # Weekly re-scan (Mondays 06:42 UTC) so newly disclosed advisories surface
    # even when no code changed.
    - cron: '42 6 * * 1'

# Cancel superseded runs on the same ref (e.g. force-pushes to a PR branch).
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Audit · License check · SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm + Node
        uses: ./.github/actions/setup-pnpm
        with:
          install: 'true'
          cache: 'true'

      # Audit the resolved dependency graph from the lockfile. No install needed
      # (install=true above populates node_modules, but `pnpm audit` only needs
      # the lockfile + registry). Fails the job when any production dependency
      # has a high/critical advisory.
      - name: pnpm audit
        run: pnpm audit --prod --audit-level high

      # Enforces the allowlist in scripts/check-licenses.mjs against the licenses
      # of all production (redistributed) dependencies.
      - name: Check production dependency licenses
        run: node scripts/check-licenses.mjs

      # Syft reads pnpm-lock.yaml / node_modules and emits a CycloneDX SBOM.
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          # We upload the artifact ourselves (below) for a stable name.
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
